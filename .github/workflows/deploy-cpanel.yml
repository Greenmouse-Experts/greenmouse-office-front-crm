name: Deploy frontend to cPanel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cpanel-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: bun run build

      - name: Package frontend
        run: |
          mkdir -p release
          tar -czf release/frontend-cpanel.tar.gz -C dist .

      - name: Configure SSH
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CPANEL_SSH_KEY" > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key
          if [ -n "$CPANEL_KNOWN_HOSTS" ]; then
            printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Upload frontend package
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || 22 }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          scp -i ~/.ssh/cpanel_deploy_key \
            -P "$CPANEL_PORT" \
            release/frontend-cpanel.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_APP_PATH/frontend-cpanel.tar.gz"

      - name: Extract frontend package
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || 22 }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          ssh -i ~/.ssh/cpanel_deploy_key -p "$CPANEL_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "APP_PATH='$CPANEL_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_PATH"
          tar -xzf frontend-cpanel.tar.gz
          rm -f frontend-cpanel.tar.gz
          echo "cPanel frontend deployment completed"
          REMOTE
